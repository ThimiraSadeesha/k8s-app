services:
  api:
    container_name: zent-api
    build:
      context: .
      dockerfile: api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - zent-network

  ui:
    container_name: zent-ui
    build:
      context: .
      dockerfile: ui.Dockerfile
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - zent-network

networks:
  zent-network:
    driver: bridge
